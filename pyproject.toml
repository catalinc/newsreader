[project]
name = "newsreader"
version = "0.1.0"
description = "A web-based RSS reader built with NiceGUI and Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0.0",
    "nicegui>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
